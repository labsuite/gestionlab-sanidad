<!-- Modal Proveedor -->
<div class="modal-overlay" id="modal-proveedor">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-proveedor-title">Nuevo proveedor</div>
      <button class="modal-close" onclick="closeModal('modal-proveedor')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid form-grid-2">
        <div class="form-group full">
          <label>Nombre comercial *</label>
          <input id="prov-nombre" placeholder="Ej: Sigma-Aldrich">
        </div>
        <!-- TIPO PROVEEDOR: MULTI-SELECCIÓN CON CHIPS -->
        <div class="form-group full">
          <label>Tipo(s) de proveedor</label>
          <div class="checkbox-group" id="prov-tipos-group">
            <label class="checkbox-chip"><input type="checkbox" value="Reactivos"> Reactivos</label>
            <label class="checkbox-chip"><input type="checkbox" value="Consumibles"> Consumibles</label>
            <label class="checkbox-chip"><input type="checkbox" value="Equipos"> Equipos</label>
            <label class="checkbox-chip"><input type="checkbox" value="Servicio técnico"> Servicio técnico</label>
            <label class="checkbox-chip"><input type="checkbox" value="Material fungible"> Material fungible</label>
            <label class="checkbox-chip"><input type="checkbox" value="Otro"> Otro</label>
          </div>
        </div>
        <div class="form-group">
          <label>Persona de contacto</label>
          <input id="prov-contacto" placeholder="">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input id="prov-email" type="email" placeholder="">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input id="prov-telefono" placeholder="">
        </div>
        <div class="form-group">
          <label>Web</label>
          <input id="prov-web" placeholder="https://...">
        </div>
        <div class="form-group full">
          <label>Observaciones</label>
          <textarea id="prov-observaciones" placeholder="Plazos habituales, condiciones, notas..."></textarea>
        </div>
      </div>
      <div class="form-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-proveedor')">Cancelar</button>
        <button class="btn btn-primary" id="btn-guardar-proveedor" onclick="guardarProveedor()">Guardar proveedor</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Ubicación -->
<div class="modal-overlay" id="modal-ubicacion">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Nueva ubicación</div>
      <button class="modal-close" onclick="closeModal('modal-ubicacion')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid form-grid-2">
        <div class="form-group">
          <label>ID Ubicación *</label>
          <input id="ubi-id" placeholder="Ej: MICRO-NEV1">
        </div>
        <div class="form-group">
          <label>Laboratorio / Aula *</label>
          <select id="ubi-lab">
            <option value="">Seleccionar...</option>
            <option>201</option>
            <option>203</option>
            <option>205 - Zona común</option>
            <option>205</option>
            <option>207 - Residuos</option>
            <option>207</option>
            <option>209</option>
          </select>
        </div>
        <div class="form-group">
          <label>Zona</label>
          <input id="ubi-zona" placeholder="Ej: Bancada norte">
        </div>
        <div class="form-group">
          <label>Subzona</label>
          <input id="ubi-subzona" placeholder="Ej: Estante 2">
        </div>
        <div class="form-group full">
          <label>Descripción completa</label>
          <textarea id="ubi-desc" placeholder=""></textarea>
        </div>
      </div>
      <div class="form-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-ubicacion')">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarUbicacion()">Guardar ubicación</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Usuario -->
<div class="modal-overlay" id="modal-usuario">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Nuevo usuario</div>
      <button class="modal-close" onclick="closeModal('modal-usuario')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid form-grid-2">
        <div class="form-group">
          <label>Nombre *</label>
          <input id="usr-nombre" placeholder="">
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input id="usr-email" type="email" placeholder="">
        </div>
        <div class="form-group">
          <label>Rol *</label>
          <select id="usr-rol" onchange="toggleUbicacionesAsignadasField(this.value)">
            <option>Administrador</option><option>Gestor</option>
            <option>Profesor</option><option>Alumno</option>
          </select>
        </div>
        <div class="form-group full" id="usr-alumno-fields" style="display:none">
          <div style="margin-bottom:14px">
            <label style="font-weight:500;font-size:13px">Ciclo formativo *</label>
            <select id="usr-ciclo-principal" onchange="_onCicloPrincipalChange(this.value)" style="width:100%;margin-top:6px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:13px">
              <option value="">— Seleccionar ciclo —</option>
            </select>
          </div>
          <div style="margin-bottom:12px">
            <label style="font-weight:500;font-size:13px">Módulos</label>
            <div id="usr-modulos-seleccionados" style="display:flex;flex-wrap:wrap;gap:6px;min-height:20px;margin-top:8px;margin-bottom:10px"></div>
            <div id="usr-modulos-checks" style="margin-top:4px;max-height:240px;overflow-y:auto;padding-right:4px"></div>
          </div>
          <div>
            <label style="font-weight:500;font-size:13px">Labs accesibles</label>
            <div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:8px">
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" class="usr-lab-check" value="201"> Lab 201</label>
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" class="usr-lab-check" value="203"> Lab 203</label>
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" class="usr-lab-check" value="205"> Lab 205</label>
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" class="usr-lab-check" value="207"> Lab 207</label>
            </div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:4px">La zona común se incluye siempre automáticamente.</div>
          </div>
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
              <input type="checkbox" id="usr-puede-revisar" style="width:16px;height:16px">
              <span>Puede revisar inventario de material fungible</span>
            </label>
            <div style="font-size:11px;color:var(--text-muted);margin-top:3px;margin-left:24px">El alumno podrá contar stock y enviar revisiones para que el profesor las apruebe.</div>
          </div>
          <input type="hidden" id="usr-ubicaciones-asignadas">
        </div>
      </div>
      <div class="form-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-usuario')">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarUsuario()">Guardar usuario</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Importar alumnos desde Sanidad CMA -->
<div class="modal-overlay" id="modal-importar-alumnos">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Importar alumnado desde Sanidad CMA</div>
      <button class="modal-close" onclick="closeModal('modal-importar-alumnos')">✕</button>
    </div>
    <div class="modal-body">
      <div id="importar-alumnos-contenido">
        <div class="empty-state" style="padding:40px 0">
          <div class="empty-state-icon">⏳</div>
          <div class="empty-state-title">Consultando Sanidad CMA...</div>
        </div>
      </div>
      <div class="form-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-importar-alumnos')">Cerrar</button>
        <button class="btn btn-primary" id="btn-confirmar-importar-alumnos" style="display:none" onclick="confirmarImportarAlumnos()">Importar seleccionados</button>
      </div>
    </div>
  </div>
</div>
