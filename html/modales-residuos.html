<!-- MODAL: Nuevo / editar tipo de residuo -->
<div class="modal-overlay" id="modal-tipo-residuo">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <div class="modal-title" id="modal-tipo-residuo-title">Nuevo tipo de residuo</div>
      <button class="modal-close" onclick="closeModal('modal-tipo-residuo')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid form-grid-2">
        <div class="form-group full">
          <label class="form-label">Nombre *</label>
          <input id="tr-nombre" class="form-input" placeholder="Ej: Alcohol etílico">
        </div>
        <div class="form-group full">
          <label class="form-label">Descripción</label>
          <textarea id="tr-descripcion" class="form-input" placeholder="Tipo de residuo, procedencia habitual…" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Peligrosidad / Clasificación</label>
          <input id="tr-riesgo" class="form-input" placeholder="Ej: Inflamable, Corrosivo, Citotóxico…">
        </div>
        <div class="form-group">
          <label class="form-label">Tipo de contenedor *</label>
          <input id="tr-contenedor" class="form-input" list="datalist-contenedor-tipos"
            placeholder="Ej: Bidón 30L solventes, Garrafa 5L…">
          <datalist id="datalist-contenedor-tipos"></datalist>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-tipo-residuo')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarTipoResiduo()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL: Añadir residuo a contenedor -->
<div class="modal-overlay" id="modal-adicion-res">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <div class="modal-title">Añadir residuo</div>
      <button class="modal-close" onclick="closeModal('modal-adicion-res')">✕</button>
    </div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:16px;padding:8px 12px;background:var(--bg-soft,#f9f9f9);border-radius:6px">
        Contenedor: <strong id="adic-contenedor-titulo"></strong>
      </div>
      <div class="form-group">
        <label class="form-label">Tipo de residuo añadido *</label>
        <select id="adic-tipo-residuo" class="form-input">
          <option value="">— Selecciona —</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Nivel del contenedor tras la adición *</label>
        <select id="adic-nivel" class="form-input">
          <option value="vacío">Vacío</option>
          <option value="25%">25% — casi vacío</option>
          <option value="50%">50% — por la mitad</option>
          <option value="75%">75% — casi lleno</option>
          <option value="lleno">Lleno</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Observaciones</label>
        <input id="adic-observaciones" class="form-input" placeholder="Práctica, cantidad aproximada…">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-adicion-res')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarAdicion()">Registrar</button>
    </div>
  </div>
</div>

<!-- MODAL: Nuevo / editar contenedor -->
<div class="modal-overlay" id="modal-contenedor-res">
  <div class="modal" style="max-width:460px">
    <div class="modal-header">
      <div class="modal-title" id="modal-contenedor-res-title">Nuevo contenedor</div>
      <button class="modal-close" onclick="closeModal('modal-contenedor-res')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Categoría de contenedor *</label>
        <input id="cont-categoria" class="form-input" list="cont-datalist-cat"
          placeholder="Ej: Bidón 30L solventes, Garrafa 5L…">
        <datalist id="cont-datalist-cat"></datalist>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Selecciona una existente o escribe una nueva.</div>
      </div>
      <div class="form-group">
        <label class="form-label">Laboratorio *</label>
        <select id="cont-lab" class="form-input">
          <option value="">— Seleccionar —</option>
          <option>201</option><option>203</option><option>205</option><option>207</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Zona</label>
        <input id="cont-zona" class="form-input" placeholder="ej. Almacén residuos">
      </div>
      <div class="form-group">
        <label class="form-label">Formato físico</label>
        <input id="cont-formato" class="form-input" list="cont-datalist-formato"
          placeholder="Ej: Garrafa 5L, Bidón azul 30L…">
        <datalist id="cont-datalist-formato">
          <option value="Bidón azul 30L (sólidos)">
          <option value="Garrafa 20L">
          <option value="Garrafa 5L">
          <option value="Bolsa plástica">
          <option value="Cubo con tapa">
          <option value="Contenedor rígido">
        </datalist>
      </div>
      <div class="form-group">
        <label class="form-label">Nivel inicial</label>
        <select id="cont-nivel-ini" class="form-input">
          <option value="vacío">Vacío</option>
          <option value="25%">25%</option>
          <option value="50%">50%</option>
          <option value="75%">75%</option>
          <option value="lleno">Lleno</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-contenedor-res')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarContenedor()">Guardar</button>
    </div>
  </div>
</div>
