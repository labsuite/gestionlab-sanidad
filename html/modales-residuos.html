<!-- MODAL: Nuevo / editar tipo de residuo -->
<div class="modal-overlay" id="modal-tipo-residuo">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <div class="modal-title" id="modal-tipo-residuo-title">Nuevo tipo de residuo</div>
      <button class="modal-close" onclick="closeModal('modal-tipo-residuo')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid form-grid-2">
        <div class="form-group full">
          <label class="form-label">Nombre *</label>
          <input id="tr-nombre" class="form-input" placeholder="Ej: Alcohol etílico">
        </div>
        <div class="form-group full">
          <label class="form-label">Descripción</label>
          <textarea id="tr-descripcion" class="form-input" placeholder="Tipo de residuo, procedencia habitual…" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Peligrosidad / Clasificación</label>
          <input id="tr-riesgo" class="form-input" placeholder="Ej: Inflamable, Corrosivo, Citotóxico…">
        </div>
        <div class="form-group">
          <label class="form-label">Tipo de contenedor *</label>
          <input id="tr-contenedor" class="form-input" list="datalist-contenedor-tipos"
            placeholder="Ej: Bidón 30L solventes, Garrafa 5L…">
          <datalist id="datalist-contenedor-tipos"></datalist>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-tipo-residuo')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarTipoResiduo()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL: Actualizar nivel de contenedor -->
<div class="modal-overlay" id="modal-res-nivel">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <div class="modal-title">Actualizar nivel — <span id="modal-nivel-titulo" style="font-weight:400"></span></div>
      <button class="modal-close" onclick="closeModal('modal-res-nivel')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Nivel actual del contenedor</label>
        <select id="res-nivel" class="form-input">
          <option value="vacío">Vacío</option>
          <option value="25%">25% — casi vacío</option>
          <option value="50%">50% — por la mitad</option>
          <option value="75%">75% — casi lleno</option>
          <option value="lleno">Lleno — hay que vaciarlo</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-res-nivel')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarNivel()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL: Añadir / editar contenedor -->
<div class="modal-overlay" id="modal-contenedor-res">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <div class="modal-title">Contenedor de residuo</div>
      <button class="modal-close" onclick="closeModal('modal-contenedor-res')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Tipo de residuo *</label>
        <select id="cont-tipo" class="form-input">
          <option value="">— Selecciona —</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Laboratorio *</label>
        <input id="cont-lab" class="form-input" placeholder="ej. 207">
      </div>
      <div class="form-group">
        <label class="form-label">Zona</label>
        <input id="cont-zona" class="form-input" placeholder="ej. Almacén residuos">
      </div>
      <div class="form-group">
        <label class="form-label">Tipo de contenedor</label>
        <select id="cont-tipo-cont" class="form-input" onchange="_toggleContTipo()">
          <option value="fijo">Fijo (bidón o cubo permanente)</option>
          <option value="rotativo">Rotativo (garrafas 5 L)</option>
        </select>
      </div>
      <div id="cont-nivel-wrap" class="form-group">
        <label class="form-label">Nivel inicial</label>
        <select id="cont-nivel-ini" class="form-input">
          <option value="vacío">Vacío</option>
          <option value="25%">25%</option>
          <option value="50%">50%</option>
          <option value="75%">75%</option>
          <option value="lleno">Lleno</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-contenedor-res')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarContenedor()">Guardar</button>
    </div>
  </div>
</div>
